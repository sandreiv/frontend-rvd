<div
  class="flex flex-wrap items-center gap-1 border-b border-gray-200 dark:border-white/10"
  role="tablist"
>
  @for (item of items(); track item.id; let i = $index) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="isSelected(item.id)"
      class="-mb-px inline-flex items-center gap-2 border-b-2 px-3 py-2 text-sm font-medium transition"
      [ngClass]="
        borderClass(item, i) +
        ' ' +
        (isSelected(item.id)
          ? 'text-gray-900 dark:text-white/90'
          : 'text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200')
      "
      (click)="selectTab(item.id)"
    >
      <span
        class="size-2 shrink-0 rounded-full"
        [ngClass]="dotClass(item, i)"
        aria-hidden="true"
      ></span>
      <span>{{ item.label }}</span>
      @if (item.badge) {
        <span
          class="rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600 dark:bg-gray-800 dark:text-gray-300"
        >
          {{ item.badge }}
        </span>
      }
    </button>
  }
</div>
