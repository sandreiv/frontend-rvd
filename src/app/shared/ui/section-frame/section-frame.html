<section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/3 lg:p-6">
  <div
    class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <div class="flex min-w-0 items-start gap-3">
      @if (iconName) {
        <div class="mt-0.5 rounded-full p-2" [class]="iconContainerClasses">
          <app-icon [name]="iconName" size="md" [classes]="resolvedIconClasses" />
        </div>
      }

      <div>
        <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
          {{ title }}
        </h3>
        @if (description) {
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            {{ description }}
          </p>
        }
      </div>
    </div>

    <div class="w-full shrink-0 sm:w-auto sm:min-w-[16rem] sm:max-w-sm">
      <ng-content select="[sectionFrameHeaderActions]" />
    </div>
  </div>
  <ng-content></ng-content>
</section>
