<section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/3 lg:p-6">
  <div class="mb-4 flex items-start gap-3">
    @if (iconName) {
      <div class="mt-0.5 rounded-full p-2" [class]="iconContainerClasses">
        <app-icon [name]="iconName" size="md" [classes]="resolvedIconClasses" />
      </div>
    }

    <div>
      <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">{{ title }}</h3>
      @if (description) {
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ description }}</p>
      }
    </div>
  </div>
  <ng-content></ng-content>
</section>
