<div class="relative">
  <button
    type="button"
    class="flex items-center text-gray-700 dark:text-gray-400"
    (click)="toggleDropdown()"
  >
    <span class="mr-3">
      <app-avatar-text
        [name]="displayName()"
        size="medium"
        [className]="'shrink-0'"
      />
    </span>

    <span class="mr-1 block text-sm font-medium text-gray-700 dark:text-gray-300">
      {{ displayName() }}
    </span>

    <app-icon
      name="chevronDown"
      size="sm"
      [classes]="
        'text-gray-500 dark:text-gray-400 transition-transform duration-200 ' +
        (isOpen() ? 'rotate-180' : '')
      "
    />
  </button>

  @if (isOpen()) {
    <div
      class="absolute right-0 mt-[17px] z-[70] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
    >
      <div class="px-3 pt-1 pb-3">
        <span class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          {{ displayName() }}
        </span>

        @if (user()?.roles?.length) {
          <div class="mt-1 space-y-0.5">
            @for (role of user()?.roles ?? []; track role) {
              <span class="block text-xs text-gray-500 dark:text-gray-400">
                {{ role }}
              </span>  
            }
          </div>
        }
      </div>

      <button
        type="button"
        (click)="onLogout()"
        class="group mt-1 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        <app-icon
          name="logout"
          size="md"
          classes="text-gray-500 group-hover:text-gray-700 dark:text-gray-400 dark:group-hover:text-gray-300"
        />
        Salir
      </button>
    </div>
  }
</div>
