<div [class]="wrapperClasses()">
  <div
    class="flex items-center justify-between gap-3 p-4 sm:px-5 sm:py-4"
  >
    <button
      type="button"
      class="flex min-w-0 flex-1 items-center justify-between gap-3 text-left"
      [attr.aria-expanded]="expanded()"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <h4 class="text-base font-semibold text-gray-800 dark:text-white">
        {{ title() }}
      </h4>
      <app-icon name="chevronDown" size="sm" [classes]="chevronClasses()" />
    </button>

    <div class="shrink-0" (click)="$event.stopPropagation()">
      <ng-content select="[collapsibleSectionActions]" />
    </div>
  </div>

  @if (expanded()) {
    <section
      class="border-t border-gray-200 px-4 pb-4 pt-4 sm:px-5 sm:pb-5 dark:border-white/5"
    >
      <div [class]="contentClassName()">
        <ng-content />
      </div>
    </section>
  }
</div>
