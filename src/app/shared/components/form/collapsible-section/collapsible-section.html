<div [class]="wrapperClasses()">
  <div
    class="flex items-center gap-2 p-4 sm:gap-3 sm:px-5 sm:py-4"
  >
    <button
      type="button"
      class="flex min-w-0 flex-1 items-center gap-3 text-left"
      [attr.aria-expanded]="expanded()"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <ng-content select="[collapsibleSectionHeader]" />

      @if (title()) {
        <h4
          class="min-w-0 flex-1 text-base font-semibold text-gray-800 dark:text-white"
        >
          {{ title() }}
        </h4>
      }
    </button>

    <div
      class="flex shrink-0 items-center gap-2"
      (click)="$event.stopPropagation()"
    >
      <ng-content select="[collapsibleSectionActions]" />
    </div>

    <button
      type="button"
      class="inline-flex shrink-0 items-center justify-center rounded-md p-1 text-gray-500 transition hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50 dark:text-gray-400 dark:hover:bg-white/5"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Contraer sección' : 'Expandir sección'"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <app-icon name="chevronDown" size="sm" [classes]="chevronClasses()" />
    </button>
  </div>

  @if (expanded()) {
    <section
      class="border-t border-gray-200 px-4 pb-4 pt-4 sm:px-5 sm:pb-5 dark:border-white/5"
    >
      <div [class]="contentClassName()">
        <ng-content />
      </div>
    </section>
  }
</div>
