<div class="relative" [class.pointer-events-none]="disabled">
  @if (valueTemplate && mode === 'select') {
    <button
      type="button"
      [disabled]="disabled"
      [ngClass]="inputClasses + ' text-left'"
      (click)="toggleSelectMode()"
      (focus)="onFocus()"
    >
      <ng-container
        [ngTemplateOutlet]="valueTemplate.template"
        [ngTemplateOutletContext]="{ $implicit: selectedOption }"
      />
    </button>
  } @else {
    <input
      type="text"
      [value]="searchText"
      [placeholder]="placeholder"
      [readonly]="mode === 'select'"
      [disabled]="disabled"
      [ngClass]="inputClasses"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (click)="toggleSelectMode()"
    />
  }

  @if (mode === 'select') {
    <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">
      <app-icon name="chevronDown" size="xs" />
    </span>
  }

  @if (isOpen) {
    <div class="absolute z-50 mt-1 w-full rounded-lg border border-gray-200 bg-white shadow-theme-lg dark:border-gray-700 dark:bg-gray-900">
      <div class="max-h-60 overflow-y-auto py-1">
        @if (loading) {
          <div class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">Buscando...</div>
        } @else if (resolvedOptions.length === 0) {
          <div class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">{{ emptyText }}</div>
        } @else {
          @for (option of resolvedOptions; track option.value) {
            <button
              type="button"
              class="flex w-full items-center justify-between px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-gray-800/60"
              (click)="selectOption(option)"
            >
              @if (optionTemplate) {
                <ng-container
                  [ngTemplateOutlet]="optionTemplate.template"
                  [ngTemplateOutletContext]="{ $implicit: option }"
                />
              } @else {
                <span class="truncate font-normal text-sm text-gray-700 dark:text-gray-200">
                  {{ option.label }}
                  @if (option.secondaryLabel) {
                    <span class="ml-1 text-xs text-gray-500 dark:text-gray-400">- {{ option.secondaryLabel }}</span>
                  }
                </span>
                @if (option.badge) {
                  <span class="rounded-full bg-gray-100 px-2 py-0.5 text-[11px] font-medium text-gray-600 dark:bg-gray-800 dark:text-gray-300">
                    {{ option.badge }}
                  </span>
                }
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>
