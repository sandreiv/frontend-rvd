<div
  class="grid gap-4"
  [class.lg:grid-cols-2]="showPreloadCallForm() || showRestrictCoordination()"
>
  <div class="min-w-0">
    <app-section-frame
      title="Convocatoria precarga"
      description="Administra la convocatoria de precarga."
      iconName="call"
      iconVariant="brand"
    >
      <app-preload-call-table
        [preloadCalls]="preloadCalls()"
        [selectedPreloadCallIds]="selectedPreloadCallIds()"
        (selectedPreloadCallIdsChange)="onSelectedPreloadCallIdsChange($event)"
        (addPreloadCall)="openPreloadCallForm()"
        (editPreloadCall)="openEditPreloadCallForm($event)"
        (deletePreloadCall)="onDeletePreloadCall($event)"
        (refreshPreloadCall)="onRefreshPreloadCallList()"
        (deleteAllPreloadCall)="onDeleteAllPreloadCall($event)"
        (restrictCoordination)="openRestrictCoordination($event)"
      />
    </app-section-frame>
  </div>

  @if (showPreloadCallForm()) {
    <div class="min-w-0">
      <app-section-frame
        [title]="formMode() === 'edit'
          ? 'Editar convocatoria precarga'
          : 'Formulario de convocatoria precarga'"
        description="Complete los datos de la convocatoria de precarga."
        iconName="plus"
        iconVariant="brand"
      >
        <app-preload-call-form
          [preloadCall]="selectedPreloadCall()"
          [mode]="formMode()"
          [isSaving]="isSaving()"
          (closeForm)="closePreloadCallForm()"
          (submitPreloadCall)="onSubmitPreloadCall($event)"
        />
      </app-section-frame>
    </div>
  } @else if (showRestrictCoordination()) {
    <div class="min-w-0">
      <app-restrict-coordination
        [restrictCoordination]="restrictCoordinations()"
        [preloadCall]="preloadCallForRestriction()"
        [selectedRestrictCoordinationIds]="selectedRestrictCoordinationIds()"
        [isSaving]="isSavingRestriction()"
        (closeView)="closeRestrictCoordination()"
        (saveRestriction)="onSaveRestriction($event)"
        (refreshRestrictCoordination)="refreshRestrictCoordinations()"
        (selectedRestrictCoordinationIdsChange)="onSelectedRestrictCoordinationIdsChange($event)"
        (deleteRestrictCoordination)="onDeleteRestrictCoordination($event)"
        (deleteAllRestrictCoordination)="onDeleteAllRestrictCoordination($event)"
      />
    </div>
  }
</div>

<app-new-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="deleteModalTitle()"
  [message]="deleteModalMessage()"
  [buttonText]="deleteModalButtonText()"
  [showCancelButton]="true"
  cancelButtonText="No, cancelar"
  (confirm)="confirmDelete()"
  (close)="closeDeleteModal()"
/>

<app-new-modal
  [isOpen]="isRestrictionDeleteModalOpen()"
  [title]="restrictionDeleteModalTitle()"
  [message]="restrictionDeleteModalMessage()"
  [buttonText]="restrictionDeleteModalButtonText()"
  [showCancelButton]="true"
  cancelButtonText="No, cancelar"
  (confirm)="confirmRestrictionDelete()"
  (close)="closeRestrictionDeleteModal()"
/>
