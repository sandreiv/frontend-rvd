<form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="rounded-xl border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-gray-900"
>

    <div class="mb-4 flex flex-col gap-1">
        <h4 class="text-sm font-semibold text-gray-900 dark:text-white">
            {{ restriction()
              ? 'Editar restricción de coordinación'
              : 'Nueva restricción de coordinación' }}
        </h4>
        <p class="text-xs text-gray-500 dark:text-gray-400">
            Selecciona la coordinación y el rango de fechas
        </p>
    </div>
    <div>
        <app-label>Coordinación</app-label>
        <app-typeahead-select
            formControlName="idCoordinacion"
            [items]="filteredCoordinations()"
            [optionAdapter]="coordinationOptionAdapter"
            placeholder="Buscar coordinación"
            emptyText="No se encontraron resultados"
            (queryChange)="onSearchCoordination($event)"
        />
    </div>
    <div class="mt-4">
        <app-date-range-picker
          [formGroup]="form"
          startControlName="fechaInicio"
          endControlName="fechaFin"
          startId="fechaInicioRestriccion"
          endId="fechaFinRestriccion"
          startPlaceholder="Fecha inicio"
          endPlaceholder="Fecha fin"
          [showLabels]="true"
        />
      </div>
      <div class="mt-4 rounded-lg border border-gray-100 p-3 dark:border-white/10">
        <div class="mb-2">
          <h5 class="text-sm font-semibold text-gray-900 dark:text-white">
            Estado de la restricción
          </h5>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Define si esta restricción quedará activa.
          </p>
        </div>
        <app-checkbox
          label="Activo"
          [checked]="form.controls.estado.value"
          (checkedChange)="form.controls.estado.setValue($event)"
        />
      </div>
      <div class="mt-5 flex justify-end gap-3">
        <app-button type="button" variant="outline" size="sm" (btnClick)="cancel.emit()">
          Cancelar
        </app-button>
        <app-button type="submit" size="sm" [disabled]="form.invalid || isSaving()">
          {{ isSaving() ? 'Guardando...' : 'Guardar' }}
        </app-button>
      </div>

</form>
