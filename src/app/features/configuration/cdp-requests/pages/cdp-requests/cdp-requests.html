<div class="grid gap-4">
  <div class="min-w-0">

    @if (!showDetail()) {

      <app-section-frame
        title="Solicitudes CPD"
        description="Administra las solicitudes CPD de las coordinaciones."
        iconName="documentPlus"
        iconVariant="brand"
      >

        <div
          sectionFrameHeaderActions
          class="flex w-full items-center gap-2"
        >

          <div
            class="min-w-0 flex-1 sm:flex-none sm:w-48"
          >
            <app-select
              [options]="periodOptions()"
              [value]="selectedPeriodId()"
              [disabled]="isLoadingPeriods()"
              placeholder="Seleccione el periodo"
              searchPlaceholder="Buscar periodo..."
              emptyText="No hay periodos disponibles"
              (valueChange)="onPeriodChange($event)"
            />
          </div>

          <div
            class="min-w-0 flex-1 sm:flex-none sm:w-64"
          >
            <app-select
              [options]="preloadCallOptions()"
              [value]="selectedPreloadCallId()"
              [disabled]="
                isLoadingPeriods() ||
                !selectedPeriodId() ||
                isLoadingPreloadCalls()
              "
              placeholder="Seleccione la convocatoria"
              searchPlaceholder="Buscar convocatoria..."
              emptyText="No hay convocatorias activas"
              (valueChange)="
                onPreloadCallChange($event)
              "
            />
          </div>

          <app-button
            type="button"
            size="sm"
            className="h-11 shrink-0 whitespace-nowrap"
            [disabled]="
              isLoadingPeriods() ||
              !selectedPeriodId() ||
              !selectedPreloadCallId() ||
              isLoadingPreloadCalls() ||
              isLoadingCoordinations()
            "
            (btnClick)="onApplyFilter()"
          >
            Filtrar
          </app-button>

        </div>

        <app-coordination-table
          [coordinations]="coordinations()"
          [(selectedCoordinationIds)]="
            selectedCoordinationIds
          "
          [emptyMessage]="tableEmptyMessage()"
          actionLabel="Solicitar CDP"
          (startPreassignment)="
            onRequestCdp($event)
          "
          (refreshCoordination)="
            onRefreshCoordinations()
          "
        />

      </app-section-frame>

    } @else if (
      selectedCoordination();
      as coordination
    ) {

      <app-cdp-request-detail
        [coordination]="coordination"
        (back)="onBackToList()"
      />

    }

  </div>
</div>
