<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-2">
    <app-label>Modalidad de contratación</app-label>
    <app-select
      [formControl]="idModalidadControl"
      [options]="modalityOptions()"
      [disabled]="modalitiesResource.isLoading()"
      placeholder="Seleccione la modalidad"
      searchPlaceholder="Buscar modalidad..."
      emptyText="No hay modalidades disponibles"
    />

    @if (idModalidadControl.touched && idModalidadControl.invalid) {
      <p class="text-xs font-medium text-red-600 dark:text-red-400">
        Debe seleccionar una modalidad.
      </p>
    }
  </div>

  @if (selectedModality(); as modality) {
    <app-change-contract-modality-form
      #assignmentForm
      [professor]="professor()"
      [coordination]="coordination()"
      [contractModality]="modality"
    />
    <app-change-contract-modality-activities
      [professor]="professor()"
      [coordination]="coordination()"
      [contractModality]="modality"
      [selectedWorkDate]="assignmentForm.selectedWorkDate()"
    />
  }
</div>
