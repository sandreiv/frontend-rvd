@if (!isNn()) {

  <div
    class="rounded-xl border border-warning-200 bg-warning-50 px-4 py-3
           dark:border-warning-500/30 dark:bg-warning-500/10"
  >
    <p
      class="text-sm text-warning-700 dark:text-warning-400"
    >
      La novedad "Asignar nombre a NN"
      solo está disponible para una carga
      sin docente asignado.
    </p>
  </div>

} @else {

  <div class="flex flex-col gap-2">

    <app-label>
      Buscar docente
    </app-label>

    <app-typeahead-select
      [items]="searchResults()"
      [optionAdapter]="professorOptionAdapter"
      [loading]="isSearching()"
      [inlineDropdown]="true"
      placeholder="Documento o nombre..."
      emptyText="No hay docentes libres para esta búsqueda"
      (queryChange)="onSearchProfessor($event)"
      (optionSelected)="onProfessorSelected($event)"
    />

    @if (selectedProfessor(); as selected) {

      <div
        class="mt-2 rounded-xl border border-gray-200
               bg-gray-50 px-4 py-3
               dark:border-white/10 dark:bg-white/5"
      >
        <p
          class="text-xs font-medium uppercase
                 tracking-wide text-gray-400"
        >
          Docente seleccionado
        </p>

        <p
          class="mt-1 text-sm font-semibold
                 text-gray-800 dark:text-white/90"
        >
          {{ selected.nombreCompleto }}
        </p>

        <p
          class="mt-0.5 text-xs text-gray-500
                 dark:text-gray-400"
        >
          {{ selected.documentoIdentidad }}
        </p>

      </div>

    }

  </div>

}
