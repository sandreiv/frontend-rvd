<app-modal
  [isOpen]="isOpen()"
  className="max-w-6xl mx-4 p-0 overflow-hidden"
  (close)="onClose()"
>
  <div class="border-b border-gray-200 px-6 py-5 dark:border-gray-700 sm:px-8">
    <div class="flex items-start gap-4">
      <div class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <app-icon name="chatBubbleBottomCenterText" size="sm" />
      </div>

      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
            Gestión de novedades
          </h3>
        </div>

        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          A continuación podra realizar las novedades necesarias para el docente seleccionado.
        </p>
      </div>
    </div>
  </div>

  <div class="max-h-[65vh] overflow-y-auto px-6 py-6 sm:px-8">
    <div class="flex flex-col gap-2">
      <app-label>Novedad</app-label>
      <app-select
        [formControl]="idNovedadControl"
        [options]="noveltyOptions()"
        [disabled]="noveltiesResource.isLoading()"
        placeholder="Seleccione la novedad"
        searchPlaceholder="Buscar novedad..."
        emptyText="No hay novedades disponibles"
      />

      @if (idNovedadControl.touched && idNovedadControl.invalid) {
        <p class="text-xs font-medium text-red-600 dark:text-red-400">
          Debe seleccionar una novedad.
        </p>
      }
    </div>
  </div>

  <div
    class="flex justify-end gap-3 border-t border-gray-200 px-6 py-5 dark:border-gray-700 sm:px-8"
  >
    <app-button
      type="button"
      [disabled]="idNovedadControl.invalid || noveltiesResource.isLoading()"
      (btnClick)="onSave()"
    >
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</app-modal>
