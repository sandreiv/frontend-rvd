<div class="grid gap-4">
  <div class="min-w-0">
    <app-section-frame
      title="Verificar docentes"
      description="Revisa los docentes pendientes de verificación por periodo, convocatoria y coordinación."
      iconName="check"
      iconVariant="brand"
    >
      <div
        sectionFrameHeaderActions
        class="flex w-full flex-wrap items-center gap-2"
      >
        <div class="min-w-0 flex-1 sm:flex-none sm:w-48">
          <app-select
            [options]="periodOptions()"
            [value]="selectedPeriodId()"
            [disabled]="isLoadingPeriods()"
            placeholder="Seleccione el periodo"
            searchPlaceholder="Buscar periodo..."
            emptyText="No hay periodos disponibles"
            (valueChange)="onPeriodChange($event)"
          />
        </div>

        <div class="min-w-0 flex-1 sm:flex-none sm:w-64">
          <app-select
            [options]="preloadCallOptions()"
            [value]="selectedPreloadCallId()"
            [disabled]="
              isLoadingPeriods() ||
              !selectedPeriodId() ||
              isLoadingPreloadCalls()
            "
            placeholder="Seleccione la convocatoria"
            searchPlaceholder="Buscar convocatoria..."
            emptyText="No hay convocatorias activas"
            (valueChange)="onPreloadCallChange($event)"
          />
        </div>

        <div class="min-w-0 flex-1 sm:flex-none sm:w-64">
          <app-select
            [options]="coordinationOptions()"
            [value]="selectedCoordinationId()"
            [disabled]="
              isLoadingPeriods() ||
              !selectedPeriodId() ||
              !selectedPreloadCallId() ||
              isLoadingPreloadCalls() ||
              isLoadingCoordinations()
            "
            placeholder="Seleccione la coordinación"
            searchPlaceholder="Buscar coordinación..."
            emptyText="No hay coordinaciones para verificar"
            (valueChange)="onCoordinationChange($event)"
          />
        </div>

        <app-button
          type="button"
          size="sm"
          className="h-11 shrink-0 whitespace-nowrap"
          [disabled]="isFilterDisabled()"
          (btnClick)="onApplyFilter()"
        >
          Filtrar
        </app-button>
      </div>

      <app-verify-professors-table
        [professors]="professors()"
        [emptyMessage]="tableEmptyMessage()"
        (refreshProfessors)="onRefreshProfessors()"
        (viewSummary)="onViewSummary($event)"
      />
    </app-section-frame>
  </div>
</div>

<app-professor-summary
  [isOpen]="showSummary()"
  [professor]="summaryProfessor()"
  [coordination]="summaryCoordination()"
  [contractModality]="summaryModality()"
  [summaryFetcher]="loadSummary"
  (close)="onCloseSummary()"
/>
