<app-data-table
  [columns]="columns"
  [rows]="records()"
  [rowIdentity]="rowIdentity"
  [emptyMessage]="emptyMessage()"
  [showAddButton]="false"
  [showDeleteButton]="false"
  [enableSelection]="true"
  [selectedRowKeys]="selectedHiringKeys()"
  searchPlaceholder="Buscar contratación..."
  (toolbarAction)="onToolbarAction($event)"
  (searchChange)="onSearchRecords($event)"
  (selectedRowKeysChange)="onSelectedHiringKeysChange($event)"
/>

<div class="mt-4 flex justify-end">
  <app-button
    type="button"
    size="sm"
    [disabled]="
      selectedHiringKeys().length === 0 ||
      isStartingProcess()
    "
    (btnClick)="onStartProcess()"
  >
    {{
      isStartingProcess()
        ? 'Iniciando...'
        : 'Iniciar proceso'
    }}
  </app-button>
</div>
