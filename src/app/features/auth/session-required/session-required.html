<app-auth-page-layout>
  <div
    class="flex w-full flex-col justify-center px-6 py-10 sm:px-12 lg:w-1/2"
  >
    <div class="mx-auto w-full max-w-md">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">
        Sesión requerida
      </h1>
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
        RVD se abre desde Vortal con un token de SecurityAuth. En desarrollo
        puedes pegar un JWT válido o abrir la app con
        <code class="text-xs">#access_token=</code>.
      </p>

      @if (errorMessage(); as message) {
        <p
          class="mt-4 rounded-xl border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400"
        >
          {{ message }}
        </p>
      }

      @if (!isProduction) {
        <label class="mt-6 block text-sm font-medium text-gray-700 dark:text-gray-300">
          JWT de SecurityAuth
        </label>
        <textarea
          class="mt-2 h-36 w-full rounded-xl border border-gray-200 bg-white p-3 text-xs text-gray-700 outline-hidden focus:border-brand-500 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200"
          [(ngModel)]="pastedToken"
          placeholder="eyJ..."
        ></textarea>
        <div class="mt-4">
          <app-button
            type="button"
            [disabled]="isSubmitting() || !pastedToken.trim()"
            (btnClick)="onBootstrapPastedToken()"
          >
            {{ isSubmitting() ? 'Validando...' : 'Iniciar sesión' }}
          </app-button>
        </div>
      }
    </div>
  </div>
</app-auth-page-layout>
