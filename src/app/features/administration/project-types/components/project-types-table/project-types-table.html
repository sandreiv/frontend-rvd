<app-data-table
  [columns]="columns"
  [rows]="projectTypes()"
  [rowIdentity]="rowIdentity"
  [rowActions]="rowActions"
  [enableSelection]="true"
  [selectedRowKeys]="selectedProjectTypeIds()"
  emptyMessage="No hay tipos de proyecto registrados."
  searchPlaceholder="Buscar tipo de proyecto..."
  (toolbarAction)="onToolbarAction($event)"
  (rowAction)="onRowAction($event)"
  (selectedRowKeysChange)="onSelectedIdsChange($event)"
/>
