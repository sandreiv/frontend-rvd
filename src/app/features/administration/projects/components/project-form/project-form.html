<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="rounded-xl border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-white/3"
>
  <div class="mb-4 flex flex-col gap-1">
    <h4 class="text-sm font-semibold text-gray-900 dark:text-white">
      {{ project() ? editTitle() : title() }}
    </h4>
    <p class="text-xs text-gray-500 dark:text-gray-400">
      {{ description() }}
    </p>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <app-label>Nombre</app-label>
      <app-input-field
        formControlName="nombre"
        placeholder="Ingrese el nombre"
      />
    </div>

    <div>
      <app-label>Descripción</app-label>
      <app-input-field
        formControlName="descripcion"
        placeholder="Ingrese la descripción"
      />
    </div>
  </div>

  <div class="mt-4">
    <app-date-range-picker
      [formGroup]="form"
      startControlName="fechaInicio"
      endControlName="fechaFin"
      startId="proyectoFechaInicio"
      endId="proyectoFechaFin"
      startPlaceholder="Fecha inicio"
      endPlaceholder="Fecha fin"
      [showLabels]="true"
    />
  </div>

  <div class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-3">
    <div>
      <app-label>Monto</app-label>
      <app-input-field
        formControlName="monto"
        placeholder="Monto"
        (focus)="onMontoFocus()"
        (blurred)="onMontoBlur()"
      />
    </div>

    <div>
      <app-label>Convocatoria proyecto</app-label>
      <app-select
        formControlName="idConvocatoriaProyectos"
        [options]="convocatoriaOptions()"
        placeholder="Seleccione convocatoria"
      />
    </div>

    <div>
      <app-label>Tipo proyecto</app-label>
      <app-select
        formControlName="idTipoProyecto"
        [options]="tipoProyectoOptions()"
        placeholder="Seleccione tipo"
      />
    </div>
  </div>

  <div class="mt-4">
    <app-label>Coordinación</app-label>
    <app-typeahead-select
      formControlName="idCoordinacion"
      [items]="filteredCoordinations()"
      [optionAdapter]="coordinationOptionAdapter"
      placeholder="Buscar coordinación"
      emptyText="No se encontraron resultados"
      (queryChange)="onSearchCoordination($event)"
    />
  </div>

  <div class="mt-5 flex justify-end gap-3">
    <app-button
      type="button"
      variant="outline"
      size="sm"
      (btnClick)="cancel.emit()"
    >
      Cancelar
    </app-button>
    <app-button type="submit" size="sm" [disabled]="form.invalid || isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</form>
