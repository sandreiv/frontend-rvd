<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="rounded-xl border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-white/3"
>
  <div class="mb-4 flex flex-col gap-1">
    <h4 class="text-sm font-semibold text-gray-900 dark:text-white">
      {{ person() ? 'Editar persona del proyecto' : 'Agregar persona' }}
    </h4>
    <p class="text-xs text-gray-500 dark:text-gray-400">
      Asocia una persona y su actividad al proyecto seleccionado.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <app-label>Nombre completo persona</app-label>
      <app-typeahead-select
        formControlName="idPersonaGeneral"
        [items]="filteredPeople()"
        [optionAdapter]="personOptionAdapter"
        placeholder="Buscar por nombre o documento"
        emptyText="No se encontraron resultados"
        (queryChange)="onSearchPerson($event)"
      />
    </div>

    <div>
      <app-label>Tipo actividad</app-label>
      <app-select
        formControlName="idTipoActividad"
        [options]="activityTypeOptions()"
        placeholder="Seleccione tipo de actividad"
      />
    </div>
  </div>

  <div class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-3">
    <div>
      <app-label>Tipo</app-label>
      <app-input-field formControlName="tipo" placeholder="Tipo" />
    </div>

    <div>
      <app-label>Horas</app-label>
      <app-input-field
        type="number"
        formControlName="horas"
        placeholder="Horas"
        min="0"
      />
    </div>

    <div>
      <app-label>Observación</app-label>
      <app-input-field
        formControlName="observacion"
        placeholder="Observación"
      />
    </div>
  </div>

  <div class="mt-5 flex justify-end gap-3">
    <app-button
      type="button"
      variant="outline"
      size="sm"
      (btnClick)="cancel.emit()"
    >
      Cancelar
    </app-button>
    <app-button type="submit" size="sm" [disabled]="form.invalid || isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</form>
