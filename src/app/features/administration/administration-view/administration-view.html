<app-breadcrumb />

<div class="grid gap-6 xl:grid-cols-[280px_minmax(0,1fr)]">
  <aside class="h-fit rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/3 xl:sticky xl:top-24">
    <div class="mb-3 flex items-start gap-3 border-b border-gray-200 pb-4 dark:border-gray-800">
      <span class="inline-flex rounded-lg bg-gray-100 p-2 text-gray-700 dark:bg-gray-800 dark:text-gray-200">
        <app-icon name="adjustmentsHorizontal" size="sm" />
      </span>

      <div>
        <h3 class="text-sm font-semibold text-gray-900 dark:text-white">
          Administración
        </h3>
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
          Administra los parámetros base del sistema
        </p>
      </div>
    </div>

    <nav class="space-y-1.5" aria-label="Menu de secciones de administración">
      @for (item of menuItems; track item.label) {
        @if (item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-300"
            class="group flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white"
          >
            <app-icon [name]="item.icon" size="xs" [classes]="'shrink-0'" />
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <button
            type="button"
            class="group flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm text-gray-400 dark:text-gray-500"
            [disabled]="item.disabled"
          >
            <app-icon [name]="item.icon" size="xs" [classes]="'shrink-0'" />
            <span>{{ item.label }}</span>
            <span class="ml-auto rounded-full border border-gray-200 px-2 py-0.5 text-[10px] uppercase tracking-wide dark:border-gray-700">
              Pronto
            </span>
          </button>
        }
      }
    </nav>
  </aside>

  <section class="min-w-0">
    <router-outlet></router-outlet>
  </section>
</div>
